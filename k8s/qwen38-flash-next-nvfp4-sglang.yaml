# Qwen3.8-Flash-Next NVFP4 (125B MoE / 6B activos + 51B PLE n-gram + 4B MTP) en
# TP=2 REPARTIDO ENTRE LOS DOS SPARKS, sobre el MISMO enlace RoCE 200G directo
# que DeepSeek. Candidato a residente del perfil `llm-tp` (tier `tooling`).
#
# Checkpoint: RadixArk/Qwen3.8-Flash-Next-NVFP4 (135 GB, 206 safetensors).
#   NVFP4 W4A4 SOLO en los expertos routed (48 capas x 512 expertos); atencion,
#   GDN, shared expert, routers, vision y los 31 tensores de MTP quedan BF16
#   byte-identicos al original -> la especulacion NEXTN funciona igual que en
#   BF16. Las tablas PLE van FP8 en disco (51 GB).
#   Runtime soportado por la ficha: SGLang con build `qwen4_exp`. vLLM NO carga
#   este layout (expertos-only NVFP4 + PLE FP8 en shards aparte).
#
# DECISIONES OPERATIVAS (26-08-2026, aprobadas):
#   - contexto 262144 (256K nativo, sin YaRN: no hay memoria para el pool de 1M
#     y el YaRN estatico penaliza contextos cortos)
#   - max-running-requests 16, mem-fraction-static 0.85
#   - MTP NEXTN steps=3 / topk=1 / draft=4, conmutable con ENABLE_MTP=false
#     SIN tocar la imagen (es el fallback si NEXTN+hibrido+FP4 da guerra)
#   - chunked-prefill 2048 y no 4096: leccion medida en DeepSeek — un prefill
#     largo hunde los decodes concurrentes (mediana 2-5 tok/s con running>=2)
#   - page-size 64 y flags mamba: OBLIGATORIOS. QSA trabaja en micro-bloques de
#     64; el radix cache sobre el estado GDN necesita extra_buffer + tracking.
#   - DeepSeek queda en Git y en disco como ROLLBACK (~10 min de ciclo de perfil).
#
# GO/NO-GO DE MEMORIA (medir en el PRIMER arranque, no asumir):
#   0.85 * ~119.7 GiB = ~101.7 GiB para pesos+KV por rank.
#   - Si el runtime mantiene el PLE en FP8: ~70-75 GiB de pesos -> pool KV
#     ~27-31 GiB/rank (~2.3M tokens agregados a 12 KB/token/rank). Sobrado.
#   - Si el PLE se decuantiza a BF16 al cargar (lo que dice la ficha RadixArk):
#     ~95-100 GiB de pesos -> pool 2-7 GiB/rank. Arranca al filo o no arranca.
#     En ese caso NO bajar contexto a ciegas: confirmar primero con el RSS y la
#     linea "KV cache pool" del log, y decidir (issue upstream para PLE FP8
#     nativo, o esperar NVFP4 oficial de Qwen).
#   El KV de este modelo es minusculo: solo 12 de 48 capas tienen KV
#   (2 KV heads x 256 dim -> 24 KB/token total, 12 KB/token/rank en TP=2).
#   Estado GDN: ~27 MB/secuencia/rank, fijo. Con 16 concurrentes, despreciable.
#
# IMAGEN: REGISTRY/sglang-qwen38next-arm64:v0.1.0
#   NO EXISTE TODAVIA — la publica la Fase 1a (ver
#   analysis/qwen38-flash-next-nvfp4/image/Dockerfile). Requisitos: SGLang con
#   `qwen4_exp` + quant `modelopt_fp4` + flashinfer con kernels NVFP4 para
#   sm_121a, aarch64. El NVFP4 de RadixArk esta validado solo en GB300/B300:
#   sm_121 es NUESTRA verificacion. Mergear este fichero no despliega nada:
#   replicas 0 y los deployments aun no estan en COMPONENTS del compute_mode.
#
# NUNCA levantar esto con DeepSeek arriba: mismos nodos (memoria) y mismo
# puerto 8888 en hostNetwork en gx10-ec3d. El switch lo hace el selector del
# dashboard cuando la Fase 2 registre estos deployments como residentes llm-tp.
#
# Topologia identica a DeepSeek (deepseek-v4-flash-0731-dspark.yaml):
#   head  = rank 0 en gx10-ec3d  (10.0.0.2), unico que expone /v1 y /metrics
#   worker= rank 1 en nvidia-dgx (10.0.0.1), sin HTTP: su salud se ve en el head
#   NCCL por rocep1s0f0 / enp1s0f0np0 (el puerto f1 NO tiene cable), guards
#   fail-closed de enlace y GID heredados del launch de DeepSeek.
#   Pesos: UNA copia en nvidia-dgx; el head los lee por el PV NFS-RDMA
#   hf-cache-nvidia-dgx-ro (5.5 GB/s medidos). Primer arranque: ~135 GB de
#   carga + grafos CUDA -> startupProbe de 60 min, como DeepSeek.
#   dist-init 10.0.0.2:25100 (25000 es el de DeepSeek; distinto a proposito
#   para que un rollback a medias no cruce rendezvous).
#
# Sampling recomendado por Qwen (se aplica en LiteLLM por familia, Fase 2c):
#   thinking t=1.0/top_p=0.95/top_k=20 ; instruct t=0.7/top_p=0.8/presence=1.5.
#   El chat_template.jinja va DENTRO del checkpoint; preserve_thinking=ON por
#   defecto es lo que maximiza hits del radix cache en agentes. No se replica
#   aqui el DEFAULT_THINKING de DeepSeek: eso vive en LiteLLM.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-flash-next-sglang-launch
  namespace: llm
data:
  # Verifica el checkpoint contra su propio index (sin totales hardcodeados:
  # el index es la fuente de verdad) y publica la ruta del snapshot para el
  # contenedor principal via /shared/snapshot_dir.
  verify_checkpoint.py: |
    import json, os, sys
    from pathlib import Path

    hub = Path(os.environ["HF_HOME"]) / "hub" / os.environ["QWEN_REPO_DIR"] / "snapshots"
    rev = os.environ.get("QWEN_REVISION", "").strip()
    if not hub.is_dir():
        sys.exit(f"ABORTA: no existe {hub} (falta la descarga; ver analysis/qwen38-flash-next-nvfp4/job-download.yaml)")
    if rev:
        snap = hub / rev
        if not snap.is_dir():
            sys.exit(f"ABORTA: snapshot pinneado {rev} no existe en {hub}")
    else:
        snaps = sorted(p for p in hub.iterdir() if p.is_dir())
        if len(snaps) != 1:
            sys.exit(f"ABORTA: QWEN_REVISION vacio y hay {len(snaps)} snapshots en {hub}: pinnear la revision")
        snap = snaps[0]

    index = snap / "model.safetensors.index.json"
    if not index.is_file():
        sys.exit(f"ABORTA: falta {index}")
    weight_files = sorted(set(json.loads(index.read_text())["weight_map"].values()))
    missing, total = [], 0
    for name in weight_files:
        f = snap / name
        try:
            size = f.resolve(strict=True).stat().st_size
        except OSError:
            missing.append(name)
            continue
        if size == 0:
            missing.append(name)
        total += size
    for extra in ("config.json", "hf_quant_config.json", "tokenizer.json", "chat_template.jinja"):
        if not (snap / extra).is_file():
            missing.append(extra)
    if missing:
        sys.exit(f"ABORTA: {len(missing)} ficheros ausentes/vacios, p.ej. {missing[:5]}")
    # 135 GB nominales; 130e9 deja margen a variaciones de shard sin dejar pasar
    # una descarga a medias.
    if total < 130e9:
        sys.exit(f"ABORTA: solo {total/1e9:.1f} GB de pesos; descarga incompleta")
    Path("/shared/snapshot_dir").write_text(str(snap))
    print(f"CHECKPOINT OK: {snap.name} · {len(weight_files)} shards · {total/1e9:.1f} GB")

  launch.sh: |
    set -euo pipefail
    MODEL_DIR="$(cat /shared/snapshot_dir)"

    # --- Enlace 200G: fail-closed antes de tocar NCCL -------------------------
    # Heredado del launch de DeepSeek: con el cable suelto o la IP RoCE ausente,
    # NCCL_NET=IB no cae a LAN — se queda en deadlock MUDO tras la carga de
    # pesos. Morir aqui, antes y con causa, es la garantia.
    : "${TP_PEER_IP:?falta TP_PEER_IP (IP RoCE del otro rank)}"
    : "${HOST_IP:?falta HOST_IP (IP RoCE local)}"
    PSTATE="$(cat "/sys/class/infiniband/$NCCL_IB_HCA/ports/1/state" 2>/dev/null || true)"
    PRATE="$(cat "/sys/class/infiniband/$NCCL_IB_HCA/ports/1/rate" 2>/dev/null || true)"
    CARRIER="$(cat "/sys/class/net/$NCCL_SOCKET_IFNAME/carrier" 2>/dev/null || true)"
    case "$PSTATE" in *ACTIVE*) ;; *)
      echo "ABORTA: $NCCL_IB_HCA puerto 1 no esta ACTIVE (state='$PSTATE'). Cable DAC?" >&2
      exit 3 ;;
    esac
    case "$PRATE" in *200*) ;; *)
      echo "ABORTA: $NCCL_IB_HCA no negocia 200G (rate='$PRATE')" >&2
      exit 3 ;;
    esac
    if [ "$CARRIER" != "1" ]; then
      echo "ABORTA: $NCCL_SOCKET_IFNAME sin carrier (interfaz o cable caidos)" >&2
      exit 3
    fi
    python3 - <<'PYNET'
    import os, socket, sys
    peer = os.environ["TP_PEER_IP"]
    want = os.environ["HOST_IP"]
    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
    try:
        s.connect((peer, 9))
    except OSError as e:
        sys.exit(f"ABORTA: sin ruta al peer TP {peer}: {e}")
    src = s.getsockname()[0]
    if src != want:
        sys.exit(f"ABORTA: el kernel enruta {peer} con source {src}, no {want}: el TP saldria por LAN")
    print(f"ENLACE200G: peer {peer} desde {want} OK")
    PYNET

    # --- GID de RoCEv2: se resuelve de sysfs en cada arranque (deriva tras
    # reboot/evento de enlace; un literal compartido cuelga NCCL en el init).
    resolve_gid() {
      local hca="$1" ip="$2" a b c d suffix i v t
      IFS=. read -r a b c d <<<"$ip"
      suffix="$(printf 'ffff:%02x%02x:%02x%02x' "$a" "$b" "$c" "$d")"
      for g in /sys/class/infiniband/"$hca"/ports/1/gids/*; do
        [ -r "$g" ] || continue
        i="$(basename "$g")"; v="$(cat "$g" 2>/dev/null || true)"
        case "$v" in
          *"$suffix")
            t="$(cat "/sys/class/infiniband/$hca/ports/1/gid_attrs/types/$i" 2>/dev/null || true)"
            case "$t" in *"RoCE v2"*) echo "$i"; return 0 ;; esac
            ;;
        esac
      done
      return 1
    }
    if ! NCCL_IB_GID_INDEX="$(resolve_gid "$NCCL_IB_HCA" "$HOST_IP")"; then
      echo "ABORTA: no resuelvo el GID RoCEv2 de $NCCL_IB_HCA para $HOST_IP" >&2
      exit 1
    fi
    export NCCL_IB_GID_INDEX
    echo "NCCL: hca=$NCCL_IB_HCA if=$NCCL_SOCKET_IFNAME ip=$HOST_IP gid_index=$NCCL_IB_GID_INDEX rank=$NODE_RANK"

    # --- MTP (NEXTN): conmutado, no borrado — el A/B con/sin especulacion es
    # de una variable, y es el primer fallback si la combinacion
    # NEXTN + hibrido GDN + FP4 resulta inestable en esta build.
    case "${ENABLE_MTP}" in
      true)
        SPEC_ARGS=(--speculative-algorithm NEXTN
                   --speculative-num-steps "${SPEC_STEPS}"
                   --speculative-eagle-topk "${SPEC_TOPK}"
                   --speculative-num-draft-tokens "${SPEC_DRAFT_TOKENS}")
        echo "QWEN_SPEC_EFFECTIVE method=NEXTN steps=${SPEC_STEPS} topk=${SPEC_TOPK} draft=${SPEC_DRAFT_TOKENS}"
        ;;
      false)
        SPEC_ARGS=()
        echo "QWEN_SPEC_INACTIVE method=none"
        ;;
      *)
        echo "ABORTA: ENABLE_MTP debe ser true|false (es: ${ENABLE_MTP})" >&2
        exit 4
        ;;
    esac

    # Parsers opcionales: el nombre exacto depende de la build qwen4_exp. Vacio
    # = no se pasa el flag (el server arranca y parsea en crudo) en vez de
    # morir por un nombre de parser desconocido.
    EXTRA_ARGS=()
    if [ -n "${REASONING_PARSER:-}" ]; then EXTRA_ARGS+=(--reasoning-parser "$REASONING_PARSER"); fi
    if [ -n "${TOOL_CALL_PARSER:-}" ]; then EXTRA_ARGS+=(--tool-call-parser "$TOOL_CALL_PARSER"); fi

    # 27-08: PARCHE DE IMAGEN EN CALIENTE — flash_attn_2_cuda*.so (FA2) esta
    # compilado contra otro torch (undefined symbol c10_cuda_check_
    # implementation) y el __init__ del paquete lo importa incondicionalmente,
    # tumbando TAMBIEN el path cute (FA4, Python/CuTe-DSL puro) que es el que
    # QSA necesita en sm_121 (el decode trtllm-gen no aplica: is_sm100=false).
    # Se sustituye el __init__ por un stub minimo: el resolver de
    # qwen_sparse_attn_backend intenta FA2 (ImportError, capturado) y cae al
    # cute, que con el stub importa limpio — verificado en el contenedor.
    # QUITAR cuando la imagen traiga un flash-attn compilado contra su torch.
    FA_DIR=$(python3 -c 'import site; print(site.getsitepackages()[0])')/flash_attn
    if [ -f "$FA_DIR/__init__.py" ]; then
      printf '__version__ = "2.8.3-stub-cute-only"\n' > "$FA_DIR/__init__.py"
      rm -rf "$FA_DIR/__pycache__"
      echo "QWEN_FA_STUB: flash_attn/__init__.py sustituido (solo path cute)"
    fi

    # 27-08: PARCHE 2 — el decode disperso de QSA tiene tres paths en esta
    # imagen: FA2 (ABI rota), FA4 cute (MLIRError de congruencia al construir
    # el kernel: "coord and shape of view are weakly congruent") y trtllm-gen
    # via flashinfer, que es el rapido y esta capado por is_sm100_supported()
    # == False en los GB10 (sm_121). El import de
    # flashinfer.decode.trtllm_batch_decode_with_kv_cache funciona en esta
    # imagen (build custom sm_121a) y con trtllm resuelto el backend no llama
    # nunca al varlen roto (qwen_sparse_attn_backend.py:1679). Se abre el gate
    # a sm120+. QUITAR cuando sglang upstream acepte sm120 aqui.
    QSA_FILE=/opt/sglang/python/sglang/srt/layers/attention/qwen_sparse_attn_backend.py
    python3 - "$QSA_FILE" <<'PYEOF'
    import sys
    p = sys.argv[1]
    s = open(p).read()
    old = "    if not is_sm100_supported():"
    new = ("    from sglang.srt.utils import is_sm120_supported\n"
           "    if not (is_sm100_supported() or is_sm120_supported()):")
    assert s.count(old) == 1, f"gate no encontrado ({s.count(old)})"
    open(p, "w").write(s.replace(old, new))
    print("QWEN_QSA_GATE: trtllm sparse decode abierto a sm120+")
    PYEOF

    # Un solo served-model-name: el alias `tooling` lo reescribe el hook de
    # LiteLLM al nombre directo, igual que con DeepSeek.
    exec python3 -m sglang.launch_server \
      --model-path "$MODEL_DIR" \
      --served-model-name qwen38-flash-next \
      --host 0.0.0.0 \
      --port 8888 \
      --tp 2 \
      --nnodes 2 \
      --node-rank "$NODE_RANK" \
      --dist-init-addr "$DIST_INIT_ADDR" \
      --trust-remote-code \
      --quantization modelopt_fp4 \
      --fp4-gemm-backend "$FP4_GEMM_BACKEND" \
      --page-size "$PAGE_SIZE" \
      --mamba-scheduler-strategy extra_buffer \
      --mamba-track-interval "$MAMBA_TRACK_INTERVAL" \
      --chunked-prefill-size "$CHUNKED_PREFILL_SIZE" \
      --max-running-requests "$MAX_RUNNING_REQUESTS" \
      --context-length "$CONTEXT_LEN" \
      --mem-fraction-static "$MEM_FRACTION_STATIC" \
      --cuda-graph-max-bs "$CUDA_GRAPH_MAX_BS" \
      --enable-metrics \
      "${SPEC_ARGS[@]}" \
      "${EXTRA_ARGS[@]}"
---
# =============================================================================
# RANK 0 — HEAD. gx10-ec3d (DGX2), igual que el head de DeepSeek: es el nodo
# con mas aire y el que carga ademas servidor de API y scheduler. Unico /v1.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-head
  namespace: llm
  labels:
    gpu.dgx-infra/pool: gb10
    # exclusive-2node y NO resident: el selector `role=resident` del gpu_arbiter
    # escalaria a 0 solo el head y dejaria al worker ocupando ~100 GiB esperando
    # un rendezvous que no llega (misma razon documentada en DeepSeek).
    gpu.dgx-infra/role: exclusive-2node
    gpu.dgx-infra/workload: llm
    llm.dgx-infra/model-family: qwen38-next
  annotations:
    # 0.80 * ~119.7 GiB = ~95.8 GiB de CUDA + overhead del proceso. En GB10 la
    # memoria de GPU es memoria del sistema: este techo y el mem-cost coinciden.
    # 26-08: con 0.85 el head (y en un intento tambien el worker) murio OOMKilled
    # (cgroup 112Gi) 3/3 veces a los 30-90s de "Capture target verify CUDA graph
    # begin" — el pico host-side de la compilacion inductor no cabe. 0.80 libera
    # ~6 GiB de margen; la KV sigue cubriendo de sobra los 262K de contexto.
    gpu.dgx-infra/mem-cost-gib: "112"
    gpu.dgx-infra/eviction-policy: exclusive-only
    llm.dgx-infra/profile: qwen38-flash-next-nvfp4-sglang-tp2-roce
    # Revision pinneada el 26-08 al terminar job-download: 135.3 GB, 419
    # ficheros, verificados 207 safetensors en el snapshot de nvidia-dgx.
    llm.dgx-infra/model-repo: RadixArk/Qwen3.8-Flash-Next-NVFP4@7b719225242aacd3dbd3f9407468c2ee9a9d2594
    llm.dgx-infra/quantization: >-
      NVFP4 W4A4 solo expertos routed (294912 tensores); atencion/GDN/shared/
      router/vision/MTP en BF16 byte-identicos; PLE n-gram FP8 en disco
      (riesgo: dequant a BF16 al cargar — ver GO/NO-GO en cabecera)
    llm.dgx-infra/runtime-stack: >-
      SGLang qwen4_exp + flashinfer_cutlass FP4 sm_121a (imagen Fase 1a,
      analysis/qwen38-flash-next-nvfp4/image/)
    llm.dgx-infra/topology: >-
      TP=2 entre gx10-ec3d (rank 0, 10.0.0.2) y nvidia-dgx (rank 1, 10.0.0.1)
      sobre RoCEv2 en rocep1s0f0 / enp1s0f0np0, enlace DAC 200G directo,
      dist-init 10.0.0.2:25100
spec:
  replicas: 0
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 5400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-flash-next-head
  template:
    metadata:
      annotations:
        # v3 (27-08): autotune de flashinfer RE-ACTIVADO. Se desactivo en v2
        # porque con la JIT fria colgo el primer arranque (26-08 21:47Z, GPU
        # 0%); con la cache de /cache/flashinfer templada arranca bien, igual
        # que paso con DeepSeek. Si un wipe de cache lo vuelve a colgar:
        # reponer --disable-flashinfer-autotune y bumpear esta revision.
        config.local/launch-revision: sglang-qwen38next-20260827-v3-autotune
      labels:
        app: qwen38-flash-next-head
        # litellm-dgx-backend-sync publica el alias leyendo los EndpointSlice
        # del Service, que selecciona por esta etiqueta.
        endpoint-role: production
        llm.dgx-infra/model-family: qwen38-next
        # Asiento de `tooling`: el Service de pool selecciona por ESTA etiqueta.
        # Los candidatos del asiento son fisicamente exclusivos en los Sparks,
        # asi que el pool tiene endpoints de UNO o de NINGUNO, nunca de dos.
        llm.dgx-infra/pool: tooling-resident
    spec:
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: gx10-ec3d
      tolerations:
        - { effect: NoSchedule, key: dedicated, operator: Equal, value: llm }
      runtimeClassName: nvidia
      restartPolicy: Always
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      # hostNetwork obligatorio: los ranks se hablan por las IPs RoCE (10.0.0.x)
      # del host. La red de pods no toca el fabric.
      hostNetwork: true
      dnsPolicy: Default
      initContainers:
        - name: verify-checkpoint
          # FASE 1A PENDIENTE: este tag no existe aun en harbor. Replicas 0 y
          # fuera de COMPONENTS: mergear no despliega nada.
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/qwen38next/verify_checkpoint.py"]
          env:
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 8Gi }
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
      containers:
        - name: sglang
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "/opt/qwen38next/launch.sh"]
          securityContext:
            privileged: false
            capabilities:
              # Fijar memoria para RDMA (equivalente k8s del memlock -1).
              add: ["IPC_LOCK"]
          env:
            - { name: NODE_RANK, value: "0" }
            - { name: HOST_IP, value: "10.0.0.2" }
            - { name: TP_PEER_IP, value: "10.0.0.1" }
            - { name: DIST_INIT_ADDR, value: "10.0.0.2:25100" }
            - { name: NCCL_IB_HCA, value: rocep1s0f0 }
            - { name: NCCL_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: GLOO_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: NCCL_NET, value: IB }
            - { name: NCCL_IB_DISABLE, value: "0" }
            - { name: NCCL_IB_ADDR_FAMILY, value: AF_INET }
            - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
            - { name: NCCL_CROSS_NIC, value: "1" }
            - { name: NCCL_CUMEM_ENABLE, value: "0" }
            - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
            - { name: NCCL_NVLS_ENABLE, value: "0" }
            - { name: NCCL_DEBUG, value: WARN }
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
            # ---- Los cuatro parametros pedidos + derivados -------------------
            - { name: CONTEXT_LEN, value: "262144" }
            - { name: MAX_RUNNING_REQUESTS, value: "16" }
            - { name: MEM_FRACTION_STATIC, value: "0.78" }
            - { name: ENABLE_MTP, value: "true" }
            - { name: SPEC_STEPS, value: "3" }
            - { name: SPEC_TOPK, value: "1" }
            - { name: SPEC_DRAFT_TOKENS, value: "4" }
            # ------------------------------------------------------------------
            - { name: FP4_GEMM_BACKEND, value: flashinfer_cutlass }
            - { name: PAGE_SIZE, value: "64" }
            - { name: MAMBA_TRACK_INTERVAL, value: "64" }
            - { name: CHUNKED_PREFILL_SIZE, value: "2048" }
            # Cubre 16 running con margen para las formas del arbol NEXTN.
            - { name: CUDA_GRAPH_MAX_BS, value: "32" }
            # Vacios = flag ausente. Rellenar cuando la build qwen4_exp
            # confirme los nombres (candidatos: qwen3 / qwen).
            - { name: REASONING_PARSER, value: "" }
            - { name: TOOL_CALL_PARSER, value: "" }
            # 27-08: acota el pico host-side de la captura de CUDA graphs. Sin
            # esto inductor lanza ~1 worker de compilacion por core (20) y el
            # pico de 20-40 GB mata el cgroup (112Gi) 30-90s tras "Capture
            # begin" — paso con 0.85 y tambien con 0.80.
            - { name: TORCHINDUCTOR_COMPILE_THREADS, value: "4" }
            # 27-08: MAX_JOBS capa el ninja del JIT de flashinfer (cpp_extension).
            # El OOM de las 00:33 fue GLOBAL del nodo nvidia-dgx, no del cgroup:
            # dmesg muestra ~200 cicc (nvcc) paralelos como detonante sobre un
            # nodo ya al limite (pool estatico pinneado + page cache de servir
            # los pesos por NFS al head). Mismo modo de fallo que el 19-08.
            - { name: MAX_JOBS, value: "1" }
            - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1" }
            # Cache JIT SEPARADA de la de DeepSeek a proposito: motores y
            # versiones distintas no deben pisarse los kernels compilados, y el
            # rollback no debe encontrarse la cache envenenada.
            - { name: FLASHINFER_WORKSPACE_BASE, value: /cache/flashinfer }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          ports:
            - { containerPort: 8888, name: http, protocol: TCP }
          # 120 x 30s = 60 min: ~135 GB por NFS-RDMA + captura de grafos + JIT
          # frio de flashinfer la primera vez.
          startupProbe:
            httpGet: { path: /health, port: 8888, scheme: HTTP }
            failureThreshold: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8888, scheme: HTTP }
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: { cpu: "4", memory: 88Gi }
            limits:
              memory: 112Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface, readOnly: true }
            - { name: flashinfer-cache, mountPath: /cache/flashinfer }
            - { name: sglang-tmp, mountPath: /tmp }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: infiniband, mountPath: /dev/infiniband }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        # Los pesos NO viven en gx10-ec3d: se leen por NFS-RDMA desde
        # nvidia-dgx, igual que DeepSeek (ver k8s/hf-cache-nvidia-dgx-nfs.yaml).
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache-nvidia-dgx-ro, readOnly: true }
        - name: flashinfer-cache
          hostPath: { path: /home/dibanez/.cache/sglang-flashinfer, type: DirectoryOrCreate }
        - name: sglang-tmp
          hostPath: { path: /home/dibanez/.cache/sglang-tmp, type: DirectoryOrCreate }
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: launch
          configMap: { name: qwen38-flash-next-sglang-launch, defaultMode: 365 }
        - name: shared
          emptyDir: {}
        # 16Gi: un rank por nodo, transporte NCCL sobre IB; medium:Memory
        # cuenta contra limits.memory.
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
# =============================================================================
# RANK 1 — WORKER. nvidia-dgx (DGX1). No expone API: participa en el TP por
# NCCL. Sin Service ni probes HTTP; si muere, lo delata el startupProbe del
# head. OJO: el hostPath de DGX1 es /home/dibanerz (errata historica del
# usuario de ese nodo), NO /home/dibanez.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-worker
  namespace: llm
  labels:
    gpu.dgx-infra/pool: gb10
    gpu.dgx-infra/role: exclusive-2node
    gpu.dgx-infra/workload: llm
    llm.dgx-infra/model-family: qwen38-next
  annotations:
    gpu.dgx-infra/mem-cost-gib: "112"
    gpu.dgx-infra/eviction-policy: exclusive-only
    llm.dgx-infra/profile: qwen38-flash-next-nvfp4-sglang-tp2-roce
    llm.dgx-infra/role-note: >-
      rank 1 de un TP=2 de dos nodos. Escala SIEMPRE junto al head: un rank
      solo no sirve nada y se queda ocupando ~100 GiB esperando el rendezvous.
spec:
  replicas: 0
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 5400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-flash-next-worker
  template:
    metadata:
      annotations:
        # v3 (27-08): autotune de flashinfer RE-ACTIVADO. Se desactivo en v2
        # porque con la JIT fria colgo el primer arranque (26-08 21:47Z, GPU
        # 0%); con la cache de /cache/flashinfer templada arranca bien, igual
        # que paso con DeepSeek. Si un wipe de cache lo vuelve a colgar:
        # reponer --disable-flashinfer-autotune y bumpear esta revision.
        config.local/launch-revision: sglang-qwen38next-20260827-v3-autotune
      labels:
        app: qwen38-flash-next-worker
        llm.dgx-infra/model-family: qwen38-next
    spec:
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: nvidia-dgx
      tolerations:
        - { effect: NoSchedule, key: dedicated, operator: Equal, value: llm }
      runtimeClassName: nvidia
      restartPolicy: Always
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      hostNetwork: true
      dnsPolicy: Default
      initContainers:
        - name: verify-checkpoint
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/qwen38next/verify_checkpoint.py"]
          env:
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 8Gi }
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
      containers:
        - name: sglang
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "/opt/qwen38next/launch.sh"]
          securityContext:
            privileged: false
            capabilities:
              add: ["IPC_LOCK"]
          env:
            - { name: NODE_RANK, value: "1" }
            - { name: HOST_IP, value: "10.0.0.1" }
            - { name: TP_PEER_IP, value: "10.0.0.2" }
            - { name: DIST_INIT_ADDR, value: "10.0.0.2:25100" }
            - { name: NCCL_IB_HCA, value: rocep1s0f0 }
            - { name: NCCL_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: GLOO_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: NCCL_NET, value: IB }
            - { name: NCCL_IB_DISABLE, value: "0" }
            - { name: NCCL_IB_ADDR_FAMILY, value: AF_INET }
            - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
            - { name: NCCL_CROSS_NIC, value: "1" }
            - { name: NCCL_CUMEM_ENABLE, value: "0" }
            - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
            - { name: NCCL_NVLS_ENABLE, value: "0" }
            - { name: NCCL_DEBUG, value: WARN }
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
            # Ambos ranks IDENTICOS en todos los parametros del motor o el TP
            # no cuadra (misma regla que DeepSeek).
            - { name: CONTEXT_LEN, value: "262144" }
            - { name: MAX_RUNNING_REQUESTS, value: "16" }
            - { name: MEM_FRACTION_STATIC, value: "0.78" }
            - { name: ENABLE_MTP, value: "true" }
            - { name: SPEC_STEPS, value: "3" }
            - { name: SPEC_TOPK, value: "1" }
            - { name: SPEC_DRAFT_TOKENS, value: "4" }
            - { name: FP4_GEMM_BACKEND, value: flashinfer_cutlass }
            - { name: PAGE_SIZE, value: "64" }
            - { name: MAMBA_TRACK_INTERVAL, value: "64" }
            - { name: CHUNKED_PREFILL_SIZE, value: "2048" }
            - { name: CUDA_GRAPH_MAX_BS, value: "32" }
            - { name: REASONING_PARSER, value: "" }
            - { name: TOOL_CALL_PARSER, value: "" }
            # 27-08: acota el pico host-side de la captura de CUDA graphs. Sin
            # esto inductor lanza ~1 worker de compilacion por core (20) y el
            # pico de 20-40 GB mata el cgroup (112Gi) 30-90s tras "Capture
            # begin" — paso con 0.85 y tambien con 0.80.
            - { name: TORCHINDUCTOR_COMPILE_THREADS, value: "4" }
            # 27-08: MAX_JOBS capa el ninja del JIT de flashinfer (cpp_extension).
            # El OOM de las 00:33 fue GLOBAL del nodo nvidia-dgx, no del cgroup:
            # dmesg muestra ~200 cicc (nvcc) paralelos como detonante sobre un
            # nodo ya al limite (pool estatico pinneado + page cache de servir
            # los pesos por NFS al head). Mismo modo de fallo que el 19-08.
            - { name: MAX_JOBS, value: "1" }
            - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1" }
            - { name: FLASHINFER_WORKSPACE_BASE, value: /cache/flashinfer }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          resources:
            requests: { cpu: "4", memory: 88Gi }
            limits:
              memory: 112Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface }
            - { name: flashinfer-cache, mountPath: /cache/flashinfer }
            - { name: sglang-tmp, mountPath: /tmp }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: infiniband, mountPath: /dev/infiniband }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: hf-cache
          hostPath: { path: /home/dibanerz/.cache/huggingface, type: Directory }
        - name: flashinfer-cache
          hostPath: { path: /home/dibanerz/.cache/sglang-flashinfer, type: DirectoryOrCreate }
        - name: sglang-tmp
          hostPath: { path: /home/dibanerz/.cache/sglang-tmp, type: DirectoryOrCreate }
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: launch
          configMap: { name: qwen38-flash-next-sglang-launch, defaultMode: 365 }
        - name: shared
          emptyDir: {}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
# Service canonico (el que consumira LiteLLM en Fase 2c). sessionAffinity como
# DeepSeek: el radix cache vive en el head, afinidad = mas hits de prefijo.
apiVersion: v1
kind: Service
metadata:
  name: qwen38-flash-next
  namespace: llm
  labels:
    infra: "false"
    llm.dgx-infra/model-family: qwen38-next
spec:
  type: ClusterIP
  # Selector estrecho (app + endpoint-role): un pod de benchmark clonado del
  # deployment no puede colarse y acabar publicado por el backend-sync.
  selector:
    app: qwen38-flash-next-head
    endpoint-role: production
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: { timeoutSeconds: 10800 }
  ports:
    - { name: http, port: 8000, targetPort: 8888, protocol: TCP }
---
# Alias con el nombre del DEPLOYMENT, solo para el autodescubrimiento del
# Control Nexus (sondea un Service llamado igual que el deployment; sin esto
# pinta el modelo offline estando vivo — misma historia que DeepSeek).
# El worker saldra offline en el HUD y es CORRECTO: no expone HTTP.
apiVersion: v1
kind: Service
metadata:
  name: qwen38-flash-next-head
  namespace: llm
  labels:
    infra: "false"
    llm.dgx-infra/model-family: qwen38-next
spec:
  type: ClusterIP
  selector:
    app: qwen38-flash-next-head
    endpoint-role: production
  ports:
    - { name: http, port: 8000, targetPort: 8888, protocol: TCP }
