# Qwen3.8-Flash-Next NVFP4 (125B MoE / 6B active + 51B n-gram PLE + 4B MTP)
# in TP=2 SPLIT ACROSS TWO NVIDIA DGX SPARK (GB10) NODES over a direct
# 200G DAC link running RoCEv2.
#
# Checkpoint: RadixArk/Qwen3.8-Flash-Next-NVFP4 (135 GB, 206 safetensors).
#   NVFP4 W4A4 ONLY on the routed experts (48 layers x 512 experts);
#   attention, GDN, shared expert, routers, vision and the 31 MTP tensors stay
#   BF16, byte-identical to the original -> NEXTN speculation works exactly as
#   in BF16. The PLE tables are FP8 on disk (51 GB).
#   Supported runtime per the model card: SGLang with the `qwen4_exp` build.
#   vLLM does NOT load this layout (experts-only NVFP4 + FP8 PLE in separate
#   shards).
#
# OPERATIONAL DECISIONS (validated in production):
#   - context 262144 (native 256K, no YaRN: there is no memory for the 1M pool
#     and static YaRN penalises short contexts)
#   - max-running-requests 16, mem-fraction-static 0.78 (see the OOM note on
#     the head Deployment: 0.85 dies during CUDA graph capture)
#   - MTP NEXTN steps=3 / topk=1 / draft=4, switchable with ENABLE_MTP=false
#     WITHOUT touching the image (first fallback if NEXTN + hybrid GDN + FP4
#     misbehaves on a given build)
#   - chunked-prefill 2048 and not 4096: measured lesson — one long prefill
#     sinks the concurrent decodes (median 2-5 tok/s with running>=2)
#   - page-size 64 and the mamba flags: MANDATORY. QSA works in 64-token
#     micro-blocks; the radix cache over the GDN state needs extra_buffer +
#     tracking.
#
# MEMORY GO/NO-GO (measure on the FIRST boot, do not assume):
#   0.78 * ~119.7 GiB = ~93 GiB for weights+KV per rank.
#   - If the runtime keeps the PLE in FP8: ~70-75 GiB of weights -> KV pool
#     is plenty. This is what we MEASURED on sm_121a: weights ~74 GiB/rank,
#     "Load weight end ... avail mem" ~33-35 GB.
#   - If the PLE dequantises to BF16 on load (what the RadixArk card says):
#     ~95-100 GiB of weights -> it boots on the edge or not at all. In that
#     case do NOT blindly lower the context: confirm with the RSS and the
#     "KV cache pool" log line first.
#   The KV of this model is tiny: only 12 of 48 layers have KV
#   (2 KV heads x 256 dim -> 24 KB/token total, 12 KB/token/rank in TP=2).
#   GDN state: ~27 MB/sequence/rank, fixed.
#
# IMAGE: REGISTRY/sglang-qwen38next-arm64:v0.1.0 (see image/Dockerfile).
#   Requirements: SGLang with `qwen4_exp` + quant `modelopt_fp4` + flashinfer
#   with NVFP4 kernels for sm_121a, aarch64. The RadixArk NVFP4 checkpoint is
#   validated upstream only on GB300/B300: sm_121 is OUR verification.
#
# NEVER run this next to another large model on the same nodes: same unified
# memory and same port 8888 on hostNetwork.
#
# Topology:
#   head  = rank 0 on node SPARK_HEAD  (10.0.0.2), the only rank exposing /v1
#           and /metrics
#   worker= rank 1 on node SPARK_WORKER (10.0.0.1), no HTTP: its health shows
#           up through the head
#   NCCL over rocep1s0f0 / enp1s0f0np0 (adjust to your NIC), fail-closed link
#   and GID guards in launch.sh.
#   Weights: ONE copy on the worker node; the head reads them over NFS
#   (NFS-RDMA over the same link measured at 5.5 GB/s). First boot: ~135 GB
#   load + CUDA graph capture + cold JIT -> 60-minute startupProbe.
#
# Sampling recommended by Qwen (apply it in your gateway, per model family):
#   thinking t=1.0/top_p=0.95/top_k=20 ; instruct t=0.7/top_p=0.8/presence=1.5.
#   The chat_template.jinja ships INSIDE the checkpoint; preserve_thinking=ON
#   by default is what maximises radix-cache hits for agents.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-flash-next-sglang-launch
  namespace: llm
data:
  # Verifies the checkpoint against its own index (no hardcoded totals: the
  # index is the source of truth) and publishes the snapshot path for the main
  # container via /shared/snapshot_dir.
  verify_checkpoint.py: |
    import json, os, sys
    from pathlib import Path

    hub = Path(os.environ["HF_HOME"]) / "hub" / os.environ["QWEN_REPO_DIR"] / "snapshots"
    rev = os.environ.get("QWEN_REVISION", "").strip()
    if not hub.is_dir():
        sys.exit(f"ABORT: {hub} does not exist (download the checkpoint first)")
    if rev:
        snap = hub / rev
        if not snap.is_dir():
            sys.exit(f"ABORT: pinned snapshot {rev} does not exist in {hub}")
    else:
        snaps = sorted(p for p in hub.iterdir() if p.is_dir())
        if len(snaps) != 1:
            sys.exit(f"ABORT: QWEN_REVISION is empty and there are {len(snaps)} snapshots in {hub}: pin the revision")
        snap = snaps[0]

    index = snap / "model.safetensors.index.json"
    if not index.is_file():
        sys.exit(f"ABORT: missing {index}")
    weight_files = sorted(set(json.loads(index.read_text())["weight_map"].values()))
    missing, total = [], 0
    for name in weight_files:
        f = snap / name
        try:
            size = f.resolve(strict=True).stat().st_size
        except OSError:
            missing.append(name)
            continue
        if size == 0:
            missing.append(name)
        total += size
    for extra in ("config.json", "hf_quant_config.json", "tokenizer.json", "chat_template.jinja"):
        if not (snap / extra).is_file():
            missing.append(extra)
    if missing:
        sys.exit(f"ABORT: {len(missing)} files missing/empty, e.g. {missing[:5]}")
    # 135 GB nominal; 130e9 leaves margin for shard variations without letting
    # a half-finished download through.
    if total < 130e9:
        sys.exit(f"ABORT: only {total/1e9:.1f} GB of weights; incomplete download")
    Path("/shared/snapshot_dir").write_text(str(snap))
    print(f"CHECKPOINT OK: {snap.name} · {len(weight_files)} shards · {total/1e9:.1f} GB")

  launch.sh: |
    set -euo pipefail
    MODEL_DIR="$(cat /shared/snapshot_dir)"

    # --- 200G link: fail closed before touching NCCL --------------------------
    # With the cable loose or the RoCE IP missing, NCCL_NET=IB does not fall
    # back to LAN — it sits in a SILENT deadlock after the weight load. Dying
    # here, early and with a cause, is the guarantee.
    : "${TP_PEER_IP:?TP_PEER_IP missing (RoCE IP of the other rank)}"
    : "${HOST_IP:?HOST_IP missing (local RoCE IP)}"
    PSTATE="$(cat "/sys/class/infiniband/$NCCL_IB_HCA/ports/1/state" 2>/dev/null || true)"
    PRATE="$(cat "/sys/class/infiniband/$NCCL_IB_HCA/ports/1/rate" 2>/dev/null || true)"
    CARRIER="$(cat "/sys/class/net/$NCCL_SOCKET_IFNAME/carrier" 2>/dev/null || true)"
    case "$PSTATE" in *ACTIVE*) ;; *)
      echo "ABORT: $NCCL_IB_HCA port 1 is not ACTIVE (state='$PSTATE'). DAC cable?" >&2
      exit 3 ;;
    esac
    case "$PRATE" in *200*) ;; *)
      echo "ABORT: $NCCL_IB_HCA does not negotiate 200G (rate='$PRATE')" >&2
      exit 3 ;;
    esac
    if [ "$CARRIER" != "1" ]; then
      echo "ABORT: $NCCL_SOCKET_IFNAME has no carrier (interface or cable down)" >&2
      exit 3
    fi
    python3 - <<'PYNET'
    import os, socket, sys
    peer = os.environ["TP_PEER_IP"]
    want = os.environ["HOST_IP"]
    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
    try:
        s.connect((peer, 9))
    except OSError as e:
        sys.exit(f"ABORT: no route to TP peer {peer}: {e}")
    src = s.getsockname()[0]
    if src != want:
        sys.exit(f"ABORT: the kernel routes {peer} with source {src}, not {want}: TP would go over the LAN")
    print(f"LINK200G: peer {peer} from {want} OK")
    PYNET

    # --- RoCEv2 GID: resolved from sysfs on every boot (it drifts after a
    # reboot/link event; a shared literal hangs NCCL during init).
    resolve_gid() {
      local hca="$1" ip="$2" a b c d suffix i v t
      IFS=. read -r a b c d <<<"$ip"
      suffix="$(printf 'ffff:%02x%02x:%02x%02x' "$a" "$b" "$c" "$d")"
      for g in /sys/class/infiniband/"$hca"/ports/1/gids/*; do
        [ -r "$g" ] || continue
        i="$(basename "$g")"; v="$(cat "$g" 2>/dev/null || true)"
        case "$v" in
          *"$suffix")
            t="$(cat "/sys/class/infiniband/$hca/ports/1/gid_attrs/types/$i" 2>/dev/null || true)"
            case "$t" in *"RoCE v2"*) echo "$i"; return 0 ;; esac
            ;;
        esac
      done
      return 1
    }
    if ! NCCL_IB_GID_INDEX="$(resolve_gid "$NCCL_IB_HCA" "$HOST_IP")"; then
      echo "ABORT: cannot resolve the RoCEv2 GID of $NCCL_IB_HCA for $HOST_IP" >&2
      exit 1
    fi
    export NCCL_IB_GID_INDEX
    echo "NCCL: hca=$NCCL_IB_HCA if=$NCCL_SOCKET_IFNAME ip=$HOST_IP gid_index=$NCCL_IB_GID_INDEX rank=$NODE_RANK"

    # --- MTP (NEXTN): switchable, not removed — the A/B with/without
    # speculation is one variable away, and it is the first fallback if the
    # NEXTN + hybrid GDN + FP4 combination turns out unstable on this build.
    case "${ENABLE_MTP}" in
      true)
        SPEC_ARGS=(--speculative-algorithm NEXTN
                   --speculative-num-steps "${SPEC_STEPS}"
                   --speculative-eagle-topk "${SPEC_TOPK}"
                   --speculative-num-draft-tokens "${SPEC_DRAFT_TOKENS}")
        echo "QWEN_SPEC_EFFECTIVE method=NEXTN steps=${SPEC_STEPS} topk=${SPEC_TOPK} draft=${SPEC_DRAFT_TOKENS}"
        ;;
      false)
        SPEC_ARGS=()
        echo "QWEN_SPEC_INACTIVE method=none"
        ;;
      *)
        echo "ABORT: ENABLE_MTP must be true|false (got: ${ENABLE_MTP})" >&2
        exit 4
        ;;
    esac

    # Optional parsers: the exact names depend on the qwen4_exp build. Empty
    # = the flag is not passed (the server boots and parses raw) instead of
    # dying on an unknown parser name.
    EXTRA_ARGS=()
    if [ -n "${REASONING_PARSER:-}" ]; then EXTRA_ARGS+=(--reasoning-parser "$REASONING_PARSER"); fi
    if [ -n "${TOOL_CALL_PARSER:-}" ]; then EXTRA_ARGS+=(--tool-call-parser "$TOOL_CALL_PARSER"); fi

    # HOT IMAGE PATCH 1 — flash_attn_2_cuda*.so (FA2) in this image is built
    # against a different torch (undefined symbol c10_cuda_check_
    # implementation) and the package __init__ imports it unconditionally,
    # which also kills the cute path (FA4, pure Python/CuTe-DSL) that QSA
    # needs on sm_121 (the trtllm-gen decode does not apply: is_sm100=false).
    # The __init__ is replaced by a minimal stub: the resolver in
    # qwen_sparse_attn_backend tries FA2 (ImportError, caught) and falls to
    # cute, which imports cleanly with the stub — verified in the container.
    # REMOVE once the image ships a flash-attn built against its torch.
    FA_DIR=$(python3 -c 'import site; print(site.getsitepackages()[0])')/flash_attn
    if [ -f "$FA_DIR/__init__.py" ]; then
      printf '__version__ = "2.8.3-stub-cute-only"\n' > "$FA_DIR/__init__.py"
      rm -rf "$FA_DIR/__pycache__"
      echo "QWEN_FA_STUB: flash_attn/__init__.py replaced (cute path only)"
    fi

    # HOT IMAGE PATCH 2 — the QSA sparse decode has three paths in this
    # image: FA2 (broken ABI), FA4 cute (MLIRError building the kernel:
    # "coord and shape of view are weakly congruent") and trtllm-gen via
    # flashinfer, which is the fast one and is gated behind
    # is_sm100_supported() == False on GB10 (sm_121). The import of
    # flashinfer.decode.trtllm_batch_decode_with_kv_cache works in this image
    # (custom sm_121a build) and with trtllm resolved the backend never calls
    # the broken varlen (qwen_sparse_attn_backend.py:1679). The gate is opened
    # to sm120+. REMOVE once sglang upstream accepts sm120 here.
    QSA_FILE=/opt/sglang/python/sglang/srt/layers/attention/qwen_sparse_attn_backend.py
    python3 - "$QSA_FILE" <<'PYEOF'
    import sys
    p = sys.argv[1]
    s = open(p).read()
    old = "    if not is_sm100_supported():"
    new = ("    from sglang.srt.utils import is_sm120_supported\n"
           "    if not (is_sm100_supported() or is_sm120_supported()):")
    assert s.count(old) == 1, f"gate not found ({s.count(old)})"
    open(p, "w").write(s.replace(old, new))
    print("QWEN_QSA_GATE: trtllm sparse decode opened to sm120+")
    PYEOF

    # A single served-model-name: gateway aliases are handled upstream.
    exec python3 -m sglang.launch_server \
      --model-path "$MODEL_DIR" \
      --served-model-name qwen38-flash-next \
      --host 0.0.0.0 \
      --port 8888 \
      --tp 2 \
      --nnodes 2 \
      --node-rank "$NODE_RANK" \
      --dist-init-addr "$DIST_INIT_ADDR" \
      --trust-remote-code \
      --quantization modelopt_fp4 \
      --fp4-gemm-backend "$FP4_GEMM_BACKEND" \
      --page-size "$PAGE_SIZE" \
      --mamba-scheduler-strategy extra_buffer \
      --mamba-track-interval "$MAMBA_TRACK_INTERVAL" \
      --chunked-prefill-size "$CHUNKED_PREFILL_SIZE" \
      --max-running-requests "$MAX_RUNNING_REQUESTS" \
      --context-length "$CONTEXT_LEN" \
      --mem-fraction-static "$MEM_FRACTION_STATIC" \
      --cuda-graph-max-bs "$CUDA_GRAPH_MAX_BS" \
      --enable-metrics \
      "${SPEC_ARGS[@]}" \
      "${EXTRA_ARGS[@]}"
---
# =============================================================================
# RANK 0 — HEAD. Put it on the node with more headroom: besides its rank it
# also runs the API server and the scheduler. The only /v1.
# Replace SPARK_HEAD / SPARK_WORKER with your two DGX Spark hostnames.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-head
  namespace: llm
  labels:
    app.kubernetes.io/part-of: qwen38-flash-next
  annotations:
    # In GB10 the GPU memory IS system memory: with mem-fraction 0.85 the
    # boot died OOMKilled 3/3 times 30-90 s into "Capture target verify CUDA
    # graph begin" — the host-side spike of the capture-time compilation does
    # not fit. 0.78 leaves real margin; the KV still covers the 262K context.
    # Pinned checkpoint revision: 135.3 GB, 207 safetensors verified.
    model-repo: RadixArk/Qwen3.8-Flash-Next-NVFP4@7b719225242aacd3dbd3f9407468c2ee9a9d2594
    quantization: >-
      NVFP4 W4A4 routed experts only (294912 tensors); attention/GDN/shared/
      router/vision/MTP byte-identical BF16; n-gram PLE FP8 on disk
      (risk: BF16 dequant on load — see the GO/NO-GO in the header)
    topology: >-
      TP=2 between SPARK_HEAD (rank 0, 10.0.0.2) and SPARK_WORKER (rank 1,
      10.0.0.1) over RoCEv2, direct 200G DAC link, dist-init 10.0.0.2:25100
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 5400
  strategy:
    # Recreate, and ALWAYS roll head and worker together: a rank restarting
    # out of step with the other leaves the survivor waiting 601 s for a
    # TCPStore rendezvous that never comes, then dying.
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-flash-next-head
  template:
    metadata:
      annotations:
        # v3: flashinfer autotune ENABLED. It was disabled for the FIRST boot
        # because with a cold JIT cache the autotune hangs the startup (GPU
        # 0%, scheduler spinning); with /cache/flashinfer warm it boots fine.
        # If a cache wipe reproduces the hang: add
        # --disable-flashinfer-autotune back and bump this revision.
        config.local/launch-revision: sglang-qwen38next-v3-autotune
      labels:
        app: qwen38-flash-next-head
        endpoint-role: production
    spec:
      imagePullSecrets:
        - name: registry-pull
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: SPARK_HEAD
      tolerations:
        - { effect: NoSchedule, key: dedicated, operator: Equal, value: llm }
      runtimeClassName: nvidia
      restartPolicy: Always
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      # hostNetwork is mandatory: the ranks talk over the host's RoCE IPs
      # (10.0.0.x). The pod network never touches the fabric.
      hostNetwork: true
      dnsPolicy: Default
      initContainers:
        - name: verify-checkpoint
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/qwen38next/verify_checkpoint.py"]
          env:
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 8Gi }
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
      containers:
        - name: sglang
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "/opt/qwen38next/launch.sh"]
          securityContext:
            privileged: false
            capabilities:
              # Pin memory for RDMA (the k8s equivalent of memlock -1).
              add: ["IPC_LOCK"]
          env:
            - { name: NODE_RANK, value: "0" }
            - { name: HOST_IP, value: "10.0.0.2" }
            - { name: TP_PEER_IP, value: "10.0.0.1" }
            - { name: DIST_INIT_ADDR, value: "10.0.0.2:25100" }
            # Adjust the HCA/interface names to your NIC.
            - { name: NCCL_IB_HCA, value: rocep1s0f0 }
            - { name: NCCL_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: GLOO_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: NCCL_NET, value: IB }
            - { name: NCCL_IB_DISABLE, value: "0" }
            - { name: NCCL_IB_ADDR_FAMILY, value: AF_INET }
            - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
            - { name: NCCL_CROSS_NIC, value: "1" }
            - { name: NCCL_CUMEM_ENABLE, value: "0" }
            - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
            - { name: NCCL_NVLS_ENABLE, value: "0" }
            - { name: NCCL_DEBUG, value: WARN }
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
            # ---- The core engine parameters ---------------------------------
            - { name: CONTEXT_LEN, value: "262144" }
            - { name: MAX_RUNNING_REQUESTS, value: "16" }
            - { name: MEM_FRACTION_STATIC, value: "0.78" }
            - { name: ENABLE_MTP, value: "true" }
            - { name: SPEC_STEPS, value: "3" }
            - { name: SPEC_TOPK, value: "1" }
            - { name: SPEC_DRAFT_TOKENS, value: "4" }
            # -----------------------------------------------------------------
            - { name: FP4_GEMM_BACKEND, value: flashinfer_cutlass }
            - { name: PAGE_SIZE, value: "64" }
            - { name: MAMBA_TRACK_INTERVAL, value: "64" }
            - { name: CHUNKED_PREFILL_SIZE, value: "2048" }
            # Covers 16 running with margin for the NEXTN tree shapes.
            - { name: CUDA_GRAPH_MAX_BS, value: "32" }
            # Empty = flag absent. Fill in once the qwen4_exp build confirms
            # the parser names (candidates: qwen3 / qwen).
            - { name: REASONING_PARSER, value: "" }
            - { name: TOOL_CALL_PARSER, value: "" }
            # Bounds the host-side spike of CUDA graph capture. Without this,
            # inductor spawns ~1 compile worker per core (20) and the
            # 20-40 GB spike kills the cgroup 30-90 s after "Capture begin".
            - { name: TORCHINDUCTOR_COMPILE_THREADS, value: "4" }
            # MAX_JOBS caps the ninja of the flashinfer JIT (cpp_extension).
            # Without it the OOM is GLOBAL to the node, not the cgroup: dmesg
            # shows ~200 parallel cicc (nvcc) processes as the trigger — a
            # single cicc compiling the cutlass FP4 fused_moe kernels reaches
            # 7.7 GB of RSS.
            - { name: MAX_JOBS, value: "1" }
            - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1" }
            # Keep this JIT cache SEPARATE from any other engine's on the same
            # nodes: different engines/versions must not overwrite each
            # other's compiled kernels, and a rollback must not find a
            # poisoned cache.
            - { name: FLASHINFER_WORKSPACE_BASE, value: /cache/flashinfer }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          ports:
            - { containerPort: 8888, name: http, protocol: TCP }
          # 120 x 30s = 60 min: ~135 GB over NFS + graph capture + cold
          # flashinfer JIT the first time.
          startupProbe:
            httpGet: { path: /health, port: 8888, scheme: HTTP }
            failureThreshold: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8888, scheme: HTTP }
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: { cpu: "4", memory: 88Gi }
            limits:
              memory: 112Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface, readOnly: true }
            - { name: flashinfer-cache, mountPath: /cache/flashinfer }
            - { name: sglang-tmp, mountPath: /tmp }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: infiniband, mountPath: /dev/infiniband }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        # The weights do NOT live on the head node: they are read over NFS
        # (ideally NFS-RDMA over the same 200G link) from the worker node.
        # Provide your own PV/PVC or an equivalent hostPath mount.
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache-ro, readOnly: true }
        - name: flashinfer-cache
          hostPath: { path: /home/YOUR_USER/.cache/sglang-flashinfer, type: DirectoryOrCreate }
        - name: sglang-tmp
          hostPath: { path: /home/YOUR_USER/.cache/sglang-tmp, type: DirectoryOrCreate }
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: launch
          configMap: { name: qwen38-flash-next-sglang-launch, defaultMode: 365 }
        - name: shared
          emptyDir: {}
        # 16Gi: one rank per node, NCCL transport over IB; medium:Memory
        # counts against limits.memory.
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
# =============================================================================
# RANK 1 — WORKER. Does not expose an API: it participates in the TP over
# NCCL. No Service and no HTTP probes; if it dies, the head's startupProbe
# gives it away. ALWAYS scale it together with the head: a lone rank serves
# nothing and sits on ~100 GiB waiting for a rendezvous that never comes.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-flash-next-worker
  namespace: llm
  labels:
    app.kubernetes.io/part-of: qwen38-flash-next
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 5400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-flash-next-worker
  template:
    metadata:
      annotations:
        # Keep in lockstep with the head's revision (see the note there).
        config.local/launch-revision: sglang-qwen38next-v3-autotune
      labels:
        app: qwen38-flash-next-worker
    spec:
      imagePullSecrets:
        - name: registry-pull
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: SPARK_WORKER
      tolerations:
        - { effect: NoSchedule, key: dedicated, operator: Equal, value: llm }
      runtimeClassName: nvidia
      restartPolicy: Always
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      hostNetwork: true
      dnsPolicy: Default
      initContainers:
        - name: verify-checkpoint
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/qwen38next/verify_checkpoint.py"]
          env:
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 8Gi }
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
      containers:
        - name: sglang
          image: REGISTRY/sglang-qwen38next-arm64:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "/opt/qwen38next/launch.sh"]
          securityContext:
            privileged: false
            capabilities:
              add: ["IPC_LOCK"]
          env:
            - { name: NODE_RANK, value: "1" }
            - { name: HOST_IP, value: "10.0.0.1" }
            - { name: TP_PEER_IP, value: "10.0.0.2" }
            - { name: DIST_INIT_ADDR, value: "10.0.0.2:25100" }
            - { name: NCCL_IB_HCA, value: rocep1s0f0 }
            - { name: NCCL_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: GLOO_SOCKET_IFNAME, value: enp1s0f0np0 }
            - { name: NCCL_NET, value: IB }
            - { name: NCCL_IB_DISABLE, value: "0" }
            - { name: NCCL_IB_ADDR_FAMILY, value: AF_INET }
            - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
            - { name: NCCL_CROSS_NIC, value: "1" }
            - { name: NCCL_CUMEM_ENABLE, value: "0" }
            - { name: NCCL_IGNORE_CPU_AFFINITY, value: "1" }
            - { name: NCCL_NVLS_ENABLE, value: "0" }
            - { name: NCCL_DEBUG, value: WARN }
            - { name: HF_HOME, value: /cache/huggingface }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_XET, value: "1" }
            # Both ranks IDENTICAL in every engine parameter or the TP does
            # not line up.
            - { name: CONTEXT_LEN, value: "262144" }
            - { name: MAX_RUNNING_REQUESTS, value: "16" }
            - { name: MEM_FRACTION_STATIC, value: "0.78" }
            - { name: ENABLE_MTP, value: "true" }
            - { name: SPEC_STEPS, value: "3" }
            - { name: SPEC_TOPK, value: "1" }
            - { name: SPEC_DRAFT_TOKENS, value: "4" }
            - { name: FP4_GEMM_BACKEND, value: flashinfer_cutlass }
            - { name: PAGE_SIZE, value: "64" }
            - { name: MAMBA_TRACK_INTERVAL, value: "64" }
            - { name: CHUNKED_PREFILL_SIZE, value: "2048" }
            - { name: CUDA_GRAPH_MAX_BS, value: "32" }
            - { name: REASONING_PARSER, value: "" }
            - { name: TOOL_CALL_PARSER, value: "" }
            # See the head for the rationale of these two.
            - { name: TORCHINDUCTOR_COMPILE_THREADS, value: "4" }
            - { name: MAX_JOBS, value: "1" }
            - { name: TORCH_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_CUDA_ARCH_LIST, value: "12.1a" }
            - { name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1" }
            - { name: FLASHINFER_WORKSPACE_BASE, value: /cache/flashinfer }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
            - { name: QWEN_REPO_DIR, value: models--RadixArk--Qwen3.8-Flash-Next-NVFP4 }
            - { name: QWEN_REVISION, value: "7b719225242aacd3dbd3f9407468c2ee9a9d2594" }
          resources:
            requests: { cpu: "4", memory: 88Gi }
            limits:
              memory: 112Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - { name: hf-cache, mountPath: /cache/huggingface }
            - { name: flashinfer-cache, mountPath: /cache/flashinfer }
            - { name: sglang-tmp, mountPath: /tmp }
            - { name: launch, mountPath: /opt/qwen38next, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: infiniband, mountPath: /dev/infiniband }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        # The worker node holds the single local copy of the weights.
        - name: hf-cache
          hostPath: { path: /home/YOUR_USER/.cache/huggingface, type: Directory }
        - name: flashinfer-cache
          hostPath: { path: /home/YOUR_USER/.cache/sglang-flashinfer, type: DirectoryOrCreate }
        - name: sglang-tmp
          hostPath: { path: /home/YOUR_USER/.cache/sglang-tmp, type: DirectoryOrCreate }
        - name: infiniband
          hostPath: { path: /dev/infiniband, type: Directory }
        - name: launch
          configMap: { name: qwen38-flash-next-sglang-launch, defaultMode: 365 }
        - name: shared
          emptyDir: {}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
# Canonical Service (what your gateway consumes). sessionAffinity because the
# radix cache lives in the head: affinity = more prefix hits.
apiVersion: v1
kind: Service
metadata:
  name: qwen38-flash-next
  namespace: llm
  labels:
    app.kubernetes.io/part-of: qwen38-flash-next
spec:
  type: ClusterIP
  # Narrow selector (app + endpoint-role): a benchmark pod cloned from the
  # deployment cannot sneak in and end up published.
  selector:
    app: qwen38-flash-next-head
    endpoint-role: production
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: { timeoutSeconds: 10800 }
  ports:
    - { name: http, port: 8000, targetPort: 8888, protocol: TCP }
